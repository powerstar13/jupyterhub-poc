# 이 파일은 JupyterHub Helm 차트의 기본 구성 값을 업데이트할 수 있습니다.
#
# 참고로 구성 참조 및 기본값을 확인하세요. 하지만 관심 있는 Helm 차트 버전을 참조하세요!
#
# Introduction to YAML:     https://www.youtube.com/watch?v=cdLNKUoMc6c
# Chart config reference:   https://zero-to-jupyterhub.readthedocs.io/en/stable/resources/reference.html
# Chart default values:     https://github.com/jupyterhub/zero-to-jupyterhub-k8s/blob/HEAD/jupyterhub/values.yaml
# Available chart versions: https://hub.jupyter.org/helm-chart/
#
debug:
  enabled: true

hub:
  config:
    Autenticator:
      auto_login: true
      enable_auth_state: true
    GenericOAuthenticator:
      client_id: jupyterhub
      client_secret: jupyterhub
      oauth_callback_url: http://localhost:80/hub/oauth_callback
      authorize_url: http://localhost:30000/realms/jhipster/protocol/openid-connect/auth
      token_url: http://localhost:30000/realms/jhipster/protocol/openid-connect/token
      userdata_url: http://localhost:30000/realms/jhipster/protocol/openid-connect/userinfo
      login_service: keycloak
      username_claim: username
      userdata_params:
        state: state
      scope:
        - openid
        - profile
        - email
        - offline_access
      allow_all: true
      admin_users:
        - admin
    JupyterHub:
      authenticator_class: "generic-oauth"
